[package]
name = "hachikuji"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2.191"
memmap2 = "0.9.12"
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"   # a crash is a silent exit; the shell keeps working
strip = true
