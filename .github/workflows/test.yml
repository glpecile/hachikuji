# Unit and golden tests of the helper on both platforms. Required on main by the ruleset.
# The tmux integration test (tests/zsh.zsh) stays local: run `make test` before a PR.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cargo-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
