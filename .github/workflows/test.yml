# Unit and golden tests of the helper on both platforms. Required on main by the ruleset.
# The tmux integration test (tests/zsh.zsh) stays local: run `make test` before a PR.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cargo-test:
    name: cargo-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # A fixed image, not macos-latest: a new image behind -latest can sit in the queue for
          # 15 minutes and get cancelled. The check names (macos, linux) stay when the image changes.
          - os: macos
            runner: macos-15
          - os: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
