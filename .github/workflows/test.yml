# Unit and golden tests of the helper. Required on main by the ruleset.
# Linux only: the tests are platform-neutral, and macOS runners can sit in the queue for 15 minutes.
# The macOS behavior (ZLE, FIFOs, terminals) is covered by the local tmux test: run `make test`
# before a PR.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cargo-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
